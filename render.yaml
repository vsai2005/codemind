# Render Blueprint — CodeMind
#
# CodeMind is ONE Next.js application: the UI and the 14 API routes under app/api
# are the same build, the same process and the same origin. It deploys as a single
# web service, not as a frontend/backend pair.
#
# Docker rather than Render's Node runtime, deliberately: the repository already has a
# production Dockerfile (non-root user, standalone output, openssl for Prisma's musl
# engine, pdfkit left unbundled so its font metrics resolve). Using it means the image
# Render runs is the image you can run locally.
#
# MIGRATIONS RUN AS A PRE-DEPLOY STEP. This used to say the opposite, and the reason it
# gave was real: the Prisma CLI is a devDependency, Next's standalone output prunes it,
# and a pre-deploy step would have had to fetch it from npm on every deploy as a
# non-root user. The Dockerfile now vendors the CLI and its schema engine into the
# runtime image, so `preDeployCommand` runs against this exact build and depends on
# nothing but it.
#
# The property that motivated the old policy is UNCHANGED: preDeployCommand runs once
# per deploy, before the new instance serves traffic — not on restart. `migrate deploy`
# is still absent from CMD, so a container restart still cannot mutate the database.
#
# What changed is who has to remember. "Apply migrations by hand from your machine" is
# a step that gets forgotten, and cannot be performed at all by someone who does not
# have that machine to hand.
#
# Every secret below is `sync: false`, so Render prompts for it once and stores it
# encrypted. No value is committed to this file.

services:
  - type: web
    name: codemind
    runtime: docker
    # Free tier. Two consequences worth knowing, both inherent to the plan:
    #
    #   Spin-down   the instance sleeps after ~15 minutes idle and cold-starts on the
    #               next request. In-memory state does not survive: rate-limit counters
    #               reset (more permissive, not broken) and the AI key scheduler
    #               reloads with no record of which keys were cooling down.
    #   Memory      512 MB. The request size defaults (CODEMIND_CHAT_BODY_MAX_BYTES
    #               and CODEMIND_REQUEST_MAX_CHARS) are already sized for this, so
    #               nothing needs setting here. On a larger instance raise them in the
    #               dashboard — no code change or rebuild.
    #
    # Change to `starter` to keep one process warm and get more headroom.
    plan: free
    # Put this in the region closest to your Aiven service — every request makes at
    # least one database round trip.
    region: oregon
    rootDir: task-saas
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true

    # Runs inside the image built above, once per deploy, before traffic is switched.
    # A failure here ABORTS the deploy and leaves the previous version serving, which
    # is the correct outcome: code that expects a column the database does not have
    # would fail on live requests instead, one user at a time.
    # The CLI lives in /opt/prisma (see Dockerfile) rather than in the app's
    # node_modules, so it is invoked by path. --schema points at the migrations that
    # shipped in this same image, which is what makes the step reproducible: the code
    # being deployed and the migrations being applied are from one build.
    preDeployCommand: node /opt/prisma/node_modules/prisma/build/index.js migrate deploy --schema=/app/prisma/schema.prisma

    envVars:
      # --- Required: the app aborts startup without these -------------------
      # Aiven connection URI. Keep the ?sslmode=require that Aiven's console gives you.
      - key: DATABASE_URL
        sync: false
      # At least 32 characters. Generate with: npx auth secret
      - key: AUTH_SECRET
        sync: false
      # Required whenever the app is served from anything other than localhost.
      - key: AUTH_TRUST_HOST
        value: "true"

      # --- Required for correct behaviour behind Render's proxy -------------
      # Render terminates TLS and forwards, so x-forwarded-for carries exactly one
      # trusted hop. Without this the header is ignored and every unauthenticated
      # request shares a single rate-limit bucket. See README "Trusted proxies".
      - key: CODEMIND_TRUSTED_PROXY_HOPS
        value: "1"
      # Never enable the shared passwordless demo account on a public host.
      - key: CODEMIND_DEMO_AUTH
        value: "false"
      # Set to the service's public URL after the first deploy assigns one, so auth
      # callbacks and secure cookies resolve correctly. Then redeploy.
      - key: AUTH_URL
        sync: false

      # --- Provider keys: at least one NVIDIA key is required ---------------
      - key: NVIDIA_API_KEY_1
        sync: false
      - key: NVIDIA_API_KEY_2
        sync: false
      - key: NVIDIA_API_KEY_3
        sync: false
      - key: NVIDIA_API_KEY_4
        sync: false
      - key: NVIDIA_API_KEY_5
        sync: false

      # --- Optional providers: an absent key just marks that model unavailable
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false

      # The Gemini model id and its label in the picker.
      #
      # Listed rather than left to their defaults because the built-in default is
      # a Pro id, and Pro ids return 429 on a Flash-only key — the failure looks
      # like "Gemini is broken" rather than "wrong tier". Set both to the Flash
      # equivalents (gemini-3-flash-preview / "Gemini 3 Flash") if that is what
      # the account can actually call. Leave blank to keep the Pro defaults.
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_DISPLAY_NAME
        sync: false

      # --- GitHub: required only for attaching a repository to a project -----
      # Without it the repo field still renders and every attach fails with
      # "Repository indexing is not configured on this server." A classic PAT
      # with NO scopes is enough; only public repositories are supported.
      - key: GITHUB_TOKEN
        sync: false

# Token limits (AI_CONTEXT_MAX_TOKENS, AI_MAX_OUTPUT_TOKENS,
# AI_ARTIFACT_MAX_OUTPUT_TOKENS) are deliberately omitted. Their shipped defaults in
# lib/env.ts are the documented production values; set them in the Render dashboard
# only to override.
